<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="46" stroke="#2563eb" stroke-width="4" opacity="0.25"/>
  <!-- Helix left strand -->
  <path d="M30 20 C30 35, 70 40, 70 50 C70 60, 30 65, 30 80" stroke="#2563eb" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Helix right strand -->
  <path d="M70 20 C70 35, 30 40, 30 50 C30 60, 70 65, 70 80" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Crossbars -->
  <line x1="30" y1="20" x2="70" y2="20" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="50" y1="34" x2="50" y2="34" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="30" y1="50" x2="70" y2="50" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="50" y1="66" x2="50" y2="66" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="30" y1="80" x2="70" y2="80" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- Center dots -->
  <circle cx="50" cy="34" r="4" fill="white" opacity="0.9"/>
  <circle cx="50" cy="66" r="4" fill="white" opacity="0.9"/>
  <circle cx="50" cy="50" r="5" fill="white"/>
</svg>
